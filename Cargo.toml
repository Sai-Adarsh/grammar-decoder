[package]
name = "grammar-decoder"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[features]
native-llama = ["dep:bindgen", "dep:jsonschema", "dep:serde"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "=0.29.1", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[build-dependencies]
bindgen = { version = "=0.71.1", default-features = false, features = ["runtime"], optional = true }
